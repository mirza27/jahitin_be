name: jahitin-app-cicd

on:
  push:
    branches:
      - main

env:
  BE_IMAGE_NAME: jahitin-be

jobs:
  # build BE
  build-be:
    name: Build & Publish Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Login ke Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build image
      - name: Build Docker Image
        run: |
          docker build -f docker/Dockerfile -t ${{ env.BE_IMAGE_NAME }}:latest .

      # Publish image
      - name: Push Docker Image
        run: |
          docker push ${{ env.BE_IMAGE_NAME }}:latest

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest

    needs: build-and-publish

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22

          script: |
            cd ~/projects/docker/jahitin_be

            echo "Pull latest code from GitHub..."
            git fetch origin
            git checkout main
            git pull origin main

            echo "Pull latest Docker image before deploy..."
            docker pull ${{ env.BE_IMAGE_NAME }}:latest

            echo "Restart application with latest image..."
            docker compose -f docker-compose.yml pull
            docker compose -f docker-compose.yml up -d --no-build --force-recreate

            echo "Remove unused images..."
            docker image prune -f

            echo "Deployment completed!"
